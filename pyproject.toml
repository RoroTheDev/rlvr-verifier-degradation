[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlvr-verifier-degradation"
version = "0.1.0"
description = "Dataset decontamination utilities for verifier research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19.0",
  "datasketch>=1.6.5",
  "numpy>=1.26.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
qwen = [
  "torch>=2.2.0",
  "transformers>=4.45.0,<5.0.0",
]

[project.scripts]
decontaminate = "decontamination_pipeline.decontamination_pipeline:main"

[tool.setuptools.packages.find]
include = ["decontamination_pipeline*"]
